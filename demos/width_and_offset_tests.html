<!doctype html>
<html>

<head>
	<meta charset="utf-8">
	<title>Testing Width and offsets</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="stylesheet" href="../src/uPlot.css">
	<style>
		.u-legend {
			color: #c7d0d9;
		}

		section {
			display: inline-block;
			vertical-align: top;
			margin: 8px;
			box-shadow: 0px 0px 8px 4px #ccc;
			background-color: #141619;
		}

		h3 {
			text-align: center;
			padding: 10px;
			background: #E1F5FE;
			margin: 0;
		}

		.uplot {
			margin: 20px 0;
		}

		.u-select {
			background: rgba(255, 255, 255, 0.07);
		}
	</style>
</head>

<body>
	<script src="../dist/uPlot.iife.js"></script>
	<script>
		const SQRT_THREE = Math.sqrt(3);
		const SQUARE = {
			name: 'SQUARE',
			svg: {
				viewBox: { minX: 0, minY: 0, width: 100, height: 100 },
				outside: 'M0 0 0 100 100 100 100 0Z',
				inside : 'M10 10 90 10 90 90 10 90Z'
			},
			draw: (path, centerX, centerY, size, strokeWidth, moveTo, lineTo, arc, bezier) => {
				const dist = (size-strokeWidth) / 2;
				moveTo(path, centerX - dist, centerY - dist);
				lineTo(path, centerX + dist, centerY - dist);
				lineTo(path, centerX + dist, centerY + dist);
				lineTo(path, centerX - dist, centerY + dist);
				path.closePath();
			},
		}
		const DIAMOND= {
			name: 'DIAMOND',
			svg: {
				viewBox: { minX: 0, minY: 0, width: 100, height: 100 },
				outside: 'M0 50 50 100 100 50 50 0Z',
				inside : 'M15 50 50 15 85 50 50 85Z'
			},
			draw: (path, centerX, centerY, size, strokeWidth, moveTo, lineTo, arc, bezier) => {
				const dist = (size - strokeWidth) / 2;
				moveTo(path, centerX + dist, centerY       );
				lineTo(path, centerX       , centerY + dist);
				lineTo(path, centerX - dist, centerY       );
				lineTo(path, centerX       , centerY - dist);
				path.closePath();
			}
		}
		const U_TRIANGLE = {
			name: 'U_TRIANGLE',
			svg: {
				viewBox: { minX: 0, minY: 0, width: 100, height: 100 },
				outside: 'M50 0 93 75 7 75Z',
				inside : 'M50 15 19.5 67.5 78.5 67.5Z'
			},
			draw: (path, centerX, centerY, size, strokeWidth, moveTo, lineTo, arc, bezier) => {
				const halfSize = (size - strokeWidth) / 2;
				const quarterSize = size/4 - strokeWidth/2;
				const halfBase = SQRT_THREE * quarterSize;
				moveTo(path, centerX + halfBase, centerY + quarterSize);
				lineTo(path, centerX - halfBase, centerY + quarterSize);
				lineTo(path, centerX           , centerY - halfSize);
				path.closePath();
			}
		}
		const D_TRIANGLE = {
			name: 'D_TRIANGLE',
			svg: {
				viewBox: { minX: 0, minY: 0, width: 100, height: 100 },
				outside: 'M50 100 93 25 7 25Z',
				inside : 'M50 85 19.5 32.5 78.5 32.5Z'
			},
			draw: (path, centerX, centerY, size, strokeWidth, moveTo, lineTo, arc, bezier) => {
				const halfSize = (size - strokeWidth) / 2;
				const quarterSize = size/4 - strokeWidth/2;
				const halfBase = SQRT_THREE * quarterSize;
				moveTo(path, centerX + halfBase, centerY - quarterSize);
				lineTo(path, centerX - halfBase, centerY - quarterSize);
				lineTo(path, centerX           , centerY + halfSize);
				path.closePath();
			}
		}
		const CROSS = {
			name: 'CROSS',
			svg: {
				viewBox: { minX: 0, minY: 0, width: 100, height: 100 },
				outside: 'M30 0 70 0 70 30 100 30 100 70 70 70 70 100 30 100 30 70 0 70 0 30 30 30Z',
				inside : 'M40 10 40 40 10 40 10 60 40 60 40 90 60 90 60 60 90 60 90 40 60 40 60 10Z'
			},
			draw: (path, centerX, centerY, size, strokeWidth, moveTo, lineTo, arc, bezier) => {
				const halfSize = (size - strokeWidth) / 2;
				const closestDistance = (size - 2*Math.floor(size/3) - strokeWidth) / 2; // Closest Distance from center

				moveTo(path, centerX - closestDistance, centerY - halfSize       );
				lineTo(path, centerX + closestDistance, centerY - halfSize       );
				lineTo(path, centerX + closestDistance, centerY - closestDistance);
				lineTo(path, centerX + halfSize       , centerY - closestDistance);
				lineTo(path, centerX + halfSize       , centerY + closestDistance);
				lineTo(path, centerX + closestDistance, centerY + closestDistance);
				lineTo(path, centerX + closestDistance, centerY + halfSize       );
				lineTo(path, centerX - closestDistance, centerY + halfSize       );
				lineTo(path, centerX - closestDistance, centerY + closestDistance);
				lineTo(path, centerX - halfSize       , centerY + closestDistance);
				lineTo(path, centerX - halfSize       , centerY - closestDistance);
				lineTo(path, centerX - closestDistance, centerY - closestDistance);
				path.closePath();
			}
		}
		const XCROSS = {
			name: 'XCROSS',
			svg: {
				viewBox: { minX: 0, minY: 0, width: 100, height: 100 },
				outside: 'M50 25 75 0 100 25 75 50 100 75 75 100 50 75 25 100 0 75 25 50 0 25 25 0Z',
				inside : 'M50 39 25 14 14 25 39 50 14 75 25 86 50 61 75 86 86 75 61 50 86 25 75 14Z'
			},
			draw: (path, centerX, centerY, size, strokeWidth, moveTo, lineTo, arc, bezier) => {
				const halfSize = (size - strokeWidth) / 2;
				const rawQuarterSize = size/4; // Raw Quarter size (ignoring the width)
				const quarterSize = halfSize - rawQuarterSize; // Quarter size (taking into account the width)

				moveTo(path, centerX + 0             , centerY - quarterSize   );
				lineTo(path, centerX + rawQuarterSize, centerY - halfSize      );
				lineTo(path, centerX + halfSize      , centerY - rawQuarterSize);
				lineTo(path, centerX + quarterSize   , centerY + 0             );
				lineTo(path, centerX + halfSize      , centerY + rawQuarterSize);
				lineTo(path, centerX + rawQuarterSize, centerY + halfSize      );
				lineTo(path, centerX + 0             , centerY + quarterSize   );
				lineTo(path, centerX - rawQuarterSize, centerY + halfSize      );
				lineTo(path, centerX - halfSize      , centerY + rawQuarterSize);
				lineTo(path, centerX - quarterSize   , centerY + 0             );
				lineTo(path, centerX - halfSize      , centerY - rawQuarterSize);
				lineTo(path, centerX - rawQuarterSize, centerY - halfSize      );
				path.closePath();
			}
		}
		const PALETTE_LIGHT = ['#005A8D', '#B71C1C', '#2E7D32', '#6A1B9A', '#EF6C00', '#00838F'];
		const PALETTE_DARK = ['#FFFF00', '#00BFFF', '#7FFF00', '#FF00FF', '#FFA500', '#00FFFF'];
		const linear_data = [
			[0, 496, 996, 1504, 2004, 2500, 2996, 3496, 4004, 4504, 5000, 7000],
			[0, 496, 1004, 1496, 2004, 2500, 2996, 3504, 3996, 4504, 5000, 0],
			[0, 496, 1004, 1496, 2004, 2300, 2796, 3304, 3796, 4304, 4800, 0],
			[0, 496, 1004, 1496, 2004, 2100, 2596, 3104, 3596, 4104, 4600, 0],
			[0, 496, 1004, 1496, 2004, 1900, 2396, 2904, 3396, 3904, 4400, 0],
		]

		function initSection(title) {
			const h3 = document.createElement('h3');
			h3.textContent = title;
			const section = document.createElement('section');
			section.appendChild(h3);
			document.body.appendChild(section);
			return section;
		}

		function genOptsLinear(sync, showPath, ovr) {
			return uPlot.assign({}, {
				width: 800,
				height: 267,
				cursor: { points: {
						fill: (u, si) => PALETTE_DARK[3],
						size: (u, si) => u.series[si].points.size - u.series[si].points.width,
						width: 0,
					},
					lock: true, sync: { key: sync, setSeries: true, },
				},
				scales: {
					x: { time: false, },
				},
				axes: [
					{ stroke: "#c7d0d9", grid: { show: true, width: 1 / devicePixelRatio, stroke: "#2c3235", }, ticks: { show: true, width: 1 / devicePixelRatio, stroke: "#2c3235", }, },
					{ scale: 'y', size: 100, side: 3, stroke: "#c7d0d9", grid: { show: true, width: 1 / devicePixelRatio, stroke: "#2c3235", }, ticks: { show: true, width: 1 / devicePixelRatio, stroke: "#2c3235", }, }
				],
				series: [
					{},
					{ label: 'S8 W2', stroke: PALETTE_DARK[2], scale: 'y', paths: showPath ? uPlot.linear : () => null, points: { fill: '#0000', size: 8, width: 2, form: SQUARE, }, },
					{ label: 'S8 W1', stroke: PALETTE_DARK[1], scale: 'y', paths: showPath ? uPlot.linear : () => null, points: { fill: '#0000', size: 8, width: 1, form: SQUARE, }, },
					{ label: 'S7 W2', stroke: PALETTE_DARK[4], scale: 'y', paths: showPath ? uPlot.linear : () => null, points: { fill: '#0000', size: 7, width: 2, form: SQUARE, }, },
					{ label: 'S7 W1', stroke: PALETTE_DARK[5], scale: 'y', paths: showPath ? uPlot.linear : () => null, points: { fill: '#0000', size: 7, width: 1, form: SQUARE, }, },
				]
			}, ovr);
		}

		const linear1Sync = uPlot.sync('linear1')
		new uPlot(genOptsLinear(linear1Sync, true, { pxAlign: 0 }), linear_data, initSection('Linear data & Horizontal & pxAlign = 0'));
		new uPlot(genOptsLinear(linear1Sync, true, { pxAlign: 1 }), linear_data, initSection('Linear data & Horizontal & pxAlign = 1'));
		new uPlot(genOptsLinear(linear1Sync, true, { scales: { x: { ori: 1 } }, pxAlign: 0 }), linear_data, initSection('Linear data & Vertical   & pxAlign = 0'));
		new uPlot(genOptsLinear(linear1Sync, true, { scales: { x: { ori: 1 } }, pxAlign: 1 }), linear_data, initSection('Linear data & Vertical   & pxAlign = 1'));

		const linear2Sync = uPlot.sync('linear2')
		new uPlot(genOptsLinear(linear2Sync, false, { pxAlign: 0 }), linear_data, initSection('Linear data & Horizontal & pxAlign = 0'));
		new uPlot(genOptsLinear(linear2Sync, false, { pxAlign: 1 }), linear_data, initSection('Linear data & Horizontal & pxAlign = 1'));
		new uPlot(genOptsLinear(linear2Sync, false, { scales: { x: { ori: 1 } }, pxAlign: 0 }), linear_data, initSection('Linear data & Vertical   & pxAlign = 0'));
		new uPlot(genOptsLinear(linear2Sync, false, { scales: { x: { ori: 1 } }, pxAlign: 1 }), linear_data, initSection('Linear data & Vertical   & pxAlign = 1'));

		const cardinality = 15;
		const data_log__linear_1 = Array(cardinality);
		const data_log__linear_2 = Array(cardinality);
		const data_log__linear_3 = Array(cardinality);
		const data_log__linear_4 = Array(cardinality);
		const data_log__log_1 = Array(cardinality);
		const data_log__log_2 = Array(cardinality);
		const data_log__log_3 = Array(cardinality);
		const data_log__log_4 = Array(cardinality);
		for (let i = 0; i < cardinality; i++) {
			data_log__linear_1[i] = i;
			data_log__linear_2[i] = i + 1;
			data_log__linear_3[i] = i + 2;
			data_log__linear_4[i] = i + 3;
			data_log__log_1[i] = 10 ** (-22 + i * 3);
			data_log__log_2[i] = data_log__log_1[i] * 10;
			data_log__log_3[i] = data_log__log_1[i] * 100;
			data_log__log_4[i] = data_log__log_1[i] * 1000;
		}
		const sups = '⁰¹²³⁴⁵⁶⁷⁸⁹'.split('');
		const neg = '⁻';
		const exponentialPrinter = val => {
			if (val == null) return '';
			const exp = Math.floor(Math.log10(val));
			const absExp = Math.abs(exp);
			const mult = val / (10 ** exp);
			const supExp = ("" + absExp).split("").map(s => sups[+s]).join("");
			return mult.toFixed(2) + "e" + (exp < 0 ? neg : '') + supExp;
		}

		function genOptsLog(sync, isXLog, isYLog, ovr) {
			return uPlot.assign({}, {
				width: 800,
				height: 567,
				cursor: { points: {
						fill: (u, si) => PALETTE_DARK[3],
						size: (u, si) => u.series[si].points.size - u.series[si].points.width,
						width: 0,
					},
					lock: true, sync: { key: sync, setSeries: true, },
				},
				scales: {
					x: { distr: isXLog ? 3 : 1, log: 10, time: false, },
					y: { distr: isYLog ? 3 : 1, log: 10, },
				},
				axes: [
					{ stroke: "#c7d0d9", grid: { width: 1 / devicePixelRatio, stroke: "#2c3235", }, ticks: { width: 1 / devicePixelRatio, stroke: "#2c3235", }, values: (u, splits) => splits.map(v => isXLog ? exponentialPrinter(v) : v), },
					{ scale: 'y', size: 100, side: 3, stroke: "#c7d0d9", grid: { show: true, width: 1 / devicePixelRatio, stroke: "#2c3235", }, ticks: { width: 1 / devicePixelRatio, stroke: "#2c3235", }, values: (u, splits) => splits.map(v => isYLog ? exponentialPrinter(v) : v), },
				],
				series: [
					{ value: (u, rawValue) => isXLog ? exponentialPrinter(rawValue) : rawValue, },
					{ label: 'S8 W2', stroke: PALETTE_DARK[2], scale: 'y', paths: () => null, points: { fill: '#0000', size: 8, width: 2, form: SQUARE, }, value: (u, rawValue) => isYLog ? exponentialPrinter(rawValue) : rawValue, },
					{ label: 'S8 W1', stroke: PALETTE_DARK[1], scale: 'y', paths: () => null, points: { fill: '#0000', size: 8, width: 1, form: SQUARE, }, value: (u, rawValue) => isYLog ? exponentialPrinter(rawValue) : rawValue, },
					{ label: 'S7 W2', stroke: PALETTE_DARK[4], scale: 'y', paths: () => null, points: { fill: '#0000', size: 7, width: 2, form: SQUARE, }, value: (u, rawValue) => isYLog ? exponentialPrinter(rawValue) : rawValue, },
					{ label: 'S7 W1', stroke: PALETTE_DARK[5], scale: 'y', paths: () => null, points: { fill: '#0000', size: 7, width: 1, form: SQUARE, }, value: (u, rawValue) => isYLog ? exponentialPrinter(rawValue) : rawValue, },
				]
			}, ovr);
		}

		const log1Sync = uPlot.sync('log1');
		new uPlot(genOptsLog(log1Sync, false, true, { pxAlign: 0 }), [data_log__linear_1, data_log__log_1, data_log__log_2, data_log__log_3, data_log__log_4], initSection('Y Logarithmic data & pxAlign = 0'));
		new uPlot(genOptsLog(log1Sync, false, true, { pxAlign: 1 }), [data_log__linear_1, data_log__log_1, data_log__log_2, data_log__log_3, data_log__log_4], initSection('Y Logarithmic data & pxAlign = 1'));
		const log2Sync = uPlot.sync('log2');
		new uPlot(genOptsLog(log2Sync, true, false, { pxAlign: 0 }), [data_log__log_1, data_log__linear_1, data_log__linear_2, data_log__linear_3, data_log__linear_4], initSection('X Logarithmic data & pxAlign = 0'));
		new uPlot(genOptsLog(log2Sync, true, false, { pxAlign: 1 }), [data_log__log_1, data_log__linear_1, data_log__linear_2, data_log__linear_3, data_log__linear_4], initSection('X Logarithmic data & pxAlign = 1'));
		const log3Sync = uPlot.sync('log3');
		new uPlot(genOptsLog(log3Sync, true, true, { pxAlign: 0 }), [data_log__log_1, data_log__log_1, data_log__log_2, data_log__log_3, data_log__log_4], initSection('X&Y Logarithmic data & pxAlign = 0'));
		new uPlot(genOptsLog(log3Sync, true, true, { pxAlign: 1 }), [data_log__log_1, data_log__log_1, data_log__log_2, data_log__log_3, data_log__log_4], initSection('X&Y Logarithmic data & pxAlign = 1'));

		
		function genOptsForm(sync, sizeFactor, ovr) {
			return uPlot.assign({}, {
				width: 800,
				height: 567,
				cursor: { points: {
							size:   (u, si)       => u.series[si].points.size*2,
							width:  (u, si, size) => u.series[si].points.size*2,
							stroke: (u, si)       => u.series[si].points.stroke(u, si) + '90',
							fill:   (u, si)       => "#fff",
					},
					lock: true, sync: { key: sync, setSeries: true, },
				},
				scales: {
					x: { time: false, },
				},
				axes: [
					{ stroke: "#c7d0d9", grid: { show: true, width: 1 / devicePixelRatio, stroke: "#2c3235", }, ticks: { show: true, width: 1 / devicePixelRatio, stroke: "#2c3235", }, },
					{ scale: 'y', size: 100, side: 3, stroke: "#c7d0d9", grid: { show: true, width: 1 / devicePixelRatio, stroke: "#2c3235", }, ticks: { show: true, width: 1 / devicePixelRatio, stroke: "#2c3235", }, }
				],
				series: [
					{},
					{ stroke: PALETTE_DARK[0], scale: 'y', paths: () => null, points: { fill: '#0000', size: 7 + sizeFactor*3, width: 1, },  label: 'CIRCLE', },
					{ stroke: PALETTE_DARK[1], scale: 'y', paths: () => null, points: { fill: '#0000', size: 6 + sizeFactor*3, width: 1, form: SQUARE, }, label: 'SQUARE', },
					{ stroke: PALETTE_DARK[2], scale: 'y', paths: () => null, points: { fill: '#0000', size: 8 + sizeFactor*3, width: 1, form: DIAMOND, }, label: 'DIAMOND', },
					{ stroke: PALETTE_DARK[3], scale: 'y', paths: () => null, points: { fill: '#0000', size: 9 + sizeFactor*4, width: 1, form: U_TRIANGLE, }, label: 'UP TRIANGLE', },
					{ stroke: PALETTE_DARK[4], scale: 'y', paths: () => null, points: { fill: '#0000', size: 9 + sizeFactor*4, width: 1, form: D_TRIANGLE, }, label: 'DOWN TRIANGLE', },
					{ stroke: PALETTE_DARK[5], scale: 'y', paths: () => null, points: { fill: '#0000', size: 8 + sizeFactor*3, width: 1, form: CROSS, }, label: 'CROSS', },
					{ stroke: PALETTE_DARK[0], scale: 'y', paths: () => null, points: { fill: '#0000', size: 8 + sizeFactor*3, width: 1, form: XCROSS, }, label: 'XCROSS', },
				]
			}, ovr);
		}

		
		const formsSync = uPlot.sync('forms');
		const cardinality_forms = 30;
		const data_forms = [
			Array(cardinality_forms),
			Array(cardinality_forms),
			Array(cardinality_forms),
			Array(cardinality_forms),
			Array(cardinality_forms),
			Array(cardinality_forms),
			Array(cardinality_forms),
			Array(cardinality_forms),
		];
		for (let i=0 ; i < cardinality_forms ; i++) {
			data_forms[0][i] = 10 * i;
			for (let j=1 ; j<data_forms.length ; j++) {
				data_forms[j][i] = 5 * (i + 3 * j);
			}
		}
		new uPlot(genOptsForm(formsSync, 0, { pxAlign: 0 }), data_forms, initSection('Small forms & pxAlign = 0'));
		new uPlot(genOptsForm(formsSync, 0, { pxAlign: 1 }), data_forms, initSection('Small forms & pxAlign = 1'));
		new uPlot(genOptsForm(formsSync, 1, { pxAlign: 0 }), data_forms, initSection('Medium forms & pxAlign = 0'));
		new uPlot(genOptsForm(formsSync, 1, { pxAlign: 1 }), data_forms, initSection('Medium forms & pxAlign = 1'));
		new uPlot(genOptsForm(formsSync, 2, { pxAlign: 0 }), data_forms, initSection('Large forms & pxAlign = 0'));
		new uPlot(genOptsForm(formsSync, 2, { pxAlign: 1 }), data_forms, initSection('Large forms & pxAlign = 1'));
	</script>
</body>

</html>
